server:
  port: ${PORT:18080}
  error:
    include-message: never
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:55432/tatame360}
    username: ${DATABASE_USER:tatame360}
    password: ${DATABASE_PASSWORD}
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
logging:
  level:
    root: INFO
    org.springframework.jdbc.core: WARN
app:
  allowed-origin: ${APP_ORIGIN:http://localhost:7357}
  cookie-secure: ${COOKIE_SECURE:true}
  demo-password: ${DEMO_PASSWORD:}
  expose-account-tokens: ${EXPOSE_ACCOUNT_TOKENS:false}
